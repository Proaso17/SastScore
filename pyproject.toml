[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sastcore"
description = "Motor SAST open-core, multi-lenguaje, orientado a CI/CD."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "sastcore contributors" }]
keywords = ["sast", "security", "static-analysis", "taint-analysis", "sarif", "cwe", "owasp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pathspec>=0.12",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
]

[project.scripts]
sastcore = "sastcore.__main__:main"

[project.urls]
Homepage = "https://github.com/sastcore/sastcore"
Repository = "https://github.com/sastcore/sastcore"

[tool.hatch.version]
path = "src/sastcore/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sastcore"]

# ---------------------------------------------------------------------------
# Calidad
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Los fixtures son código deliberadamente inseguro; no se lintean ni tipan.
extend-exclude = ["tests/rules/fixtures"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
exclude = ['tests/rules/fixtures/']
warn_unreachable = true
warn_redundant_casts = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tree_sitter_language_pack.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["sastcore"]
