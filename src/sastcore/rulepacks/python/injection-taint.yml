- id: py.taint.sql-injection
  languages: [python]
  mode: taint
  severity: HIGH
  confidence: HIGH
  message: "Entrada no confiable alcanza una consulta SQL: inyección SQL."
  cwe: ["CWE-89"]
  owasp: "A03:2021-Injection"
  sources:
    - pattern: request.args
    - pattern: request.form
    - pattern: request.values
    - pattern: request.json
    - pattern: request.data
    - pattern: request.cookies
  sanitizers:
    - pattern: int($X)
  sinks:
    - pattern: $CUR.execute($Q, ...)
      taint_arg: 0
    - pattern: $CUR.executemany($Q, ...)
      taint_arg: 0
  fix_suggestion: "Usa consultas parametrizadas: cursor.execute('... WHERE id = %s', [id])."
  references:
    - https://cwe.mitre.org/data/definitions/89.html
  tests:
    bad: tests/rules/fixtures/python/py.taint.sql-injection_bad.py
    good: tests/rules/fixtures/python/py.taint.sql-injection_good.py

- id: py.taint.command-injection
  languages: [python]
  mode: taint
  severity: CRITICAL
  confidence: HIGH
  message: "Entrada no confiable alcanza la ejecución de comandos del sistema."
  cwe: ["CWE-78"]
  owasp: "A03:2021-Injection"
  sources:
    - pattern: request.args
    - pattern: request.form
    - pattern: request.values
    - pattern: request.json
    - pattern: request.data
  sanitizers:
    - pattern: shlex.quote($X)
  sinks:
    - pattern: os.system($X)
      taint_arg: 0
    - pattern: os.popen($X)
      taint_arg: 0
    - pattern: subprocess.call($X, ...)
      taint_arg: 0
    - pattern: subprocess.run($X, ...)
      taint_arg: 0
    - pattern: subprocess.Popen($X, ...)
      taint_arg: 0
  fix_suggestion: "Evita el shell; pasa una lista de argumentos: subprocess.run(['cmd', arg])."
  references:
    - https://cwe.mitre.org/data/definitions/78.html
  tests:
    bad: tests/rules/fixtures/python/py.taint.command-injection_bad.py
    good: tests/rules/fixtures/python/py.taint.command-injection_good.py
