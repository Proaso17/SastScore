- id: py.dangerous.os-system
  languages: [python]
  mode: pattern
  severity: HIGH
  confidence: MEDIUM
  message: >-
    Ejecución de comando del sistema con os.system; riesgo de inyección de comandos
    si la entrada no es de confianza.
  cwe: ["CWE-78"]
  owasp: "A03:2021-Injection"
  pattern: "os.system($X)"
  fix_suggestion: >-
    Usa subprocess con una lista de argumentos y sin shell: cada argumento va por
    separado, así el sistema no interpreta metacaracteres del shell.
  fix_example: |
    import subprocess
    subprocess.run(["ping", "-c", "1", host], check=True)
  references:
    - https://cwe.mitre.org/data/definitions/78.html
  tests:
    bad: tests/rules/fixtures/python/py.dangerous.os-system_bad.py
    good: tests/rules/fixtures/python/py.dangerous.os-system_good.py

- id: py.dangerous.eval
  languages: [python]
  mode: pattern
  severity: HIGH
  confidence: MEDIUM
  message: >-
    Uso de eval(); ejecución de código arbitrario si la entrada no es de confianza.
  cwe: ["CWE-95"]
  owasp: "A03:2021-Injection"
  pattern: "eval($X)"
  fix_suggestion: >-
    Evita eval(). Para leer datos usa ast.literal_eval; para elegir lógica, un
    diccionario de despacho en vez de ejecutar texto.
  fix_example: |
    import ast
    value = ast.literal_eval(user_input)   # solo literales, nunca código
  references:
    - https://cwe.mitre.org/data/definitions/95.html
  tests:
    bad: tests/rules/fixtures/python/py.dangerous.eval_bad.py
    good: tests/rules/fixtures/python/py.dangerous.eval_good.py

- id: py.dangerous.yaml-load
  languages: [python]
  mode: pattern
  severity: HIGH
  confidence: MEDIUM
  message: >-
    yaml.load con un solo argumento usa el Loader por defecto y permite deserialización
    insegura.
  cwe: ["CWE-502"]
  owasp: "A08:2021-Software and Data Integrity Failures"
  pattern: "yaml.load($X)"
  fix_suggestion: "Usa yaml.safe_load, que solo construye tipos básicos y no objetos arbitrarios."
  fix_example: |
    import yaml
    data = yaml.safe_load(stream)
  references:
    - https://cwe.mitre.org/data/definitions/502.html
  tests:
    bad: tests/rules/fixtures/python/py.dangerous.yaml-load_bad.py
    good: tests/rules/fixtures/python/py.dangerous.yaml-load_good.py

- id: py.dangerous.exec
  languages: [python]
  mode: pattern
  severity: HIGH
  confidence: MEDIUM
  message: "Uso de exec(); ejecución de código arbitrario si la entrada no es de confianza."
  cwe: ["CWE-95"]
  owasp: "A03:2021-Injection"
  pattern: "exec($X)"
  fix_suggestion: >-
    Evita exec(). Sustitúyelo por un despacho explícito: mapea nombres permitidos a
    funciones reales en lugar de ejecutar texto.
  fix_example: |
    ACTIONS = {"start": start, "stop": stop}
    ACTIONS[name]()   # solo se ejecutan acciones conocidas
  references:
    - https://cwe.mitre.org/data/definitions/95.html
  tests:
    bad: tests/rules/fixtures/python/py.dangerous.exec_bad.py
    good: tests/rules/fixtures/python/py.dangerous.exec_good.py

- id: py.dangerous.tempfile-mktemp
  languages: [python]
  mode: pattern
  severity: MEDIUM
  confidence: HIGH
  message: "tempfile.mktemp tiene una condición de carrera (TOCTOU); es inseguro."
  cwe: ["CWE-377"]
  pattern: "tempfile.mktemp(...)"
  fix_suggestion: "Usa mkstemp/NamedTemporaryFile, que crean el fichero de forma atómica."
  fix_example: |
    import tempfile
    fd, path = tempfile.mkstemp()
  references:
    - https://cwe.mitre.org/data/definitions/377.html
  tests:
    bad: tests/rules/fixtures/python/py.dangerous.tempfile-mktemp_bad.py
    good: tests/rules/fixtures/python/py.dangerous.tempfile-mktemp_good.py
